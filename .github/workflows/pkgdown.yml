on:
  push:
    branches: [main, master]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CMDSTAN_VERSION: "2.35.0"
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.2.0'
          use-public-rspm: true

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y make pngquant

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::cmdstanr, local::.
          needs: website

      - name: Cache CmdStan
        uses: actions/cache@v4
        id: cmdstan-cache
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ runner.os }}-${{ env.CMDSTAN_VERSION }}

      - name: Install CmdStan
        if: steps.cmdstan-cache.outputs.cache-hit != 'true'
        run: |
          Rscript -e "cmdstanr::install_cmdstan(version = Sys.getenv('CMDSTAN_VERSION'), cores = parallel::detectCores())"

      - name: Set CmdStan path
        run: |
          Rscript -e "cmdstanr::set_cmdstan_path(file.path(Sys.getenv('HOME'), '.cmdstan', paste0('cmdstan-', Sys.getenv('CMDSTAN_VERSION'))))"

      - name: Build site
        # install = TRUE: several vignettes do library(RBExT), which needs the
        # package genuinely installed rather than just pkgload::load_all()'d
        # (install = FALSE, pkgdown's own default) - otherwise vignette
        # rendering fails with "there is no package called 'RBExT'".
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = TRUE)
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.6.8
        with:
          clean: false
          branch: gh-pages
          folder: docs
